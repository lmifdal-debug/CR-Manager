<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CR Manager - M. MIFDAL Lahcen</title>
    <!-- Bibliothèques -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Firebase SDK pour la sauvegarde -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.FirebaseAPI = { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, getFirestore, collection, doc, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot, query };
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .prose-custom li { margin-bottom: 0.5rem; position: relative; padding-left: 1.5rem; }
        .prose-custom li::before { content: "•"; position: absolute; left: 0; color: #6366f1; font-weight: bold; }
    </style>
</head>
<body class="bg-slate-50 overflow-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={`inline-block ${className}`}></i>;
        };

        const App = () => {
            const [axes, setAxes] = useState([]);
            const [meetings, setMeetings] = useState([]);
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);

            // États de navigation
            const [activeTab, setActiveTab] = useState('dashboard');
            const [selectedAxisId, setSelectedAxisId] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [notification, setNotification] = useState(null);
            const [archiveExpanded, setArchiveExpanded] = useState(false);

            // États des modales
            const [showMeetingModal, setShowMeetingModal] = useState(false);
            const [showNewAxisModal, setShowNewAxisModal] = useState(false);
            const [editingMeetingId, setEditingMeetingId] = useState(null);
            
            // État pour la confirmation de suppression
            const [deleteConfirm, setDeleteConfirm] = useState({ show: false, id: null, type: null });

            // Formulaires
            const [meetingForm, setMeetingForm] = useState({
                axisId: '', date: new Date().toISOString().split('T')[0],
                attendees: '', discussed: '', nextSteps: ''
            });
            const [newAxis, setNewAxis] = useState({ title: '', description: '' });

            // --- CONFIGURATION FIREBASE ---
            useEffect(() => {
                const initFirebase = async () => {
                    const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, getFirestore } = window.FirebaseAPI;
                    
                    const firebaseConfig = JSON.parse(__firebase_config);
                    const app = initializeApp(firebaseConfig);
                    const auth = getAuth(app);
                    const db = getFirestore(app);
                    window.db = db;

                    const initAuth = async () => {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    };
                    
                    await initAuth();
                    onAuthStateChanged(auth, (u) => {
                        setUser(u);
                        setLoading(false);
                    });
                };
                initFirebase();
            }, []);

            // --- SYNCHRONISATION DES DONNÉES ---
            useEffect(() => {
                if (!user) return;
                const { collection, onSnapshot } = window.FirebaseAPI;
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'cr-manager-app';

                const axesCol = collection(window.db, 'artifacts', appId, 'public', 'data', 'axes');
                const unsubAxes = onSnapshot(axesCol, (snapshot) => {
                    setAxes(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                }, (err) => console.error("Erreur axes:", err));

                const meetingsCol = collection(window.db, 'artifacts', appId, 'public', 'data', 'meetings');
                const unsubMeetings = onSnapshot(meetingsCol, (snapshot) => {
                    setMeetings(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                }, (err) => console.error("Erreur meetings:", err));

                return () => { unsubAxes(); unsubMeetings(); };
            }, [user]);

            useEffect(() => { if (notification) setTimeout(() => setNotification(null), 3000); }, [notification]);

            // --- ACTIONS CLOUD ---
            const saveMeeting = async () => {
                if (!meetingForm.axisId || !meetingForm.discussed || !user) return;
                const { collection, doc, setDoc, addDoc } = window.FirebaseAPI;
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'cr-manager-app';
                const colRef = collection(window.db, 'artifacts', appId, 'public', 'data', 'meetings');

                try {
                    if (editingMeetingId) {
                        await setDoc(doc(colRef, editingMeetingId), meetingForm);
                        setNotification("Compte-rendu mis à jour.");
                    } else {
                        await addDoc(colRef, meetingForm);
                        setNotification("Compte-rendu sauvegardé !");
                    }
                    setShowMeetingModal(false);
                } catch (e) { setNotification("Erreur de sauvegarde."); }
            };

            const executeDelete = async () => {
                if (!user || !deleteConfirm.id) return;
                const { doc, deleteDoc } = window.FirebaseAPI;
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'cr-manager-app';
                
                try {
                    if (deleteConfirm.type === 'meeting') {
                        await deleteDoc(doc(window.db, 'artifacts', appId, 'public', 'data', 'meetings', deleteConfirm.id));
                        setNotification("Compte-rendu supprimé.");
                    } else if (deleteConfirm.type === 'axis') {
                        await deleteDoc(doc(window.db, 'artifacts', appId, 'public', 'data', 'axes', deleteConfirm.id));
                        setSelectedAxisId(null);
                        setActiveTab('dashboard');
                        setNotification("Axe supprimé.");
                    }
                } catch (e) {
                    setNotification("Erreur de suppression.");
                } finally {
                    setDeleteConfirm({ show: false, id: null, type: null });
                }
            };

            const addAxis = async () => {
                if (!newAxis.title || !user) return;
                const { collection, addDoc } = window.FirebaseAPI;
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'cr-manager-app';
                try {
                    await addDoc(collection(window.db, 'artifacts', appId, 'public', 'data', 'axes'), {
                        ...newAxis, isClosed: false, closedAt: null
                    });
                    setShowNewAxisModal(false);
                    setNewAxis({ title: '', description: '' });
                    setNotification("Nouvel axe créé.");
                } catch (e) { setNotification("Erreur axe."); }
            };

            const toggleAxisStatus = async (id, currentStatus) => {
                if (!user) return;
                const { doc, updateDoc } = window.FirebaseAPI;
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'cr-manager-app';
                await updateDoc(doc(window.db, 'artifacts', appId, 'public', 'data', 'axes', id), {
                    isClosed: !currentStatus,
                    closedAt: !currentStatus ? new Date().toISOString() : null
                });
            };

            const openMeetingModal = (meeting = null) => {
                if (meeting) {
                    setEditingMeetingId(meeting.id);
                    setMeetingForm({ ...meeting });
                } else {
                    setEditingMeetingId(null);
                    setMeetingForm({
                        axisId: selectedAxisId || '',
                        date: new Date().toISOString().split('T')[0],
                        attendees: '', discussed: '', nextSteps: ''
                    });
                }
                setShowMeetingModal(true);
            };

            // --- RENDU UI ---
            const renderAttendeeBadges = (str) => {
                if (!str) return null;
                return (
                    <div className="flex flex-wrap gap-1.5 mt-1 text-left">
                        {str.split(/[;,]/).map(s => s.trim()).filter(Boolean).map((name, i) => (
                            <span key={i} className="px-2.5 py-0.5 rounded-lg text-[10px] font-bold bg-indigo-50 text-indigo-700 border border-indigo-100 shadow-sm whitespace-nowrap">
                                {name}
                            </span>
                        ))}
                    </div>
                );
            };

            const formatContent = (text) => {
                if (!text) return null;
                return text.split('\n').map((line, i) => {
                    let formatted = line
                        .replace(/\*\*(.*?)\*\*/g, '<strong class="font-bold text-slate-900">$1</strong>')
                        .replace(/_(.*?)_/g, '<em class="italic">$1</em>')
                        .replace(/^[\-\*]\s(.*)/g, '<li>$1</li>')
                        .replace(/\[rouge\](.*?)\[\/rouge\]/gi, '<span class="text-red-600 font-semibold">$1</span>')
                        .replace(/\[bleu\](.*?)\[\/bleu\]/gi, '<span class="text-blue-600 font-semibold">$1</span>')
                        .replace(/\[vert\](.*?)\[\/vert\]/gi, '<span class="text-green-600 font-semibold">$1</span>');
                    if (line.startsWith('- ') || line.startsWith('* ')) return <ul key={i} className="prose-custom text-left" dangerouslySetInnerHTML={{ __html: formatted }} />;
                    return <div key={i} dangerouslySetInnerHTML={{ __html: formatted || '&nbsp;' }} className="min-h-[1.5rem] text-left" />;
                });
            };

            const filteredMeetings = useMemo(() => {
                let result = meetings;
                if (activeTab === 'axis' && selectedAxisId) result = result.filter(m => m.axisId === selectedAxisId);
                if (searchTerm) {
                    const low = searchTerm.toLowerCase();
                    result = result.filter(m => m.discussed.toLowerCase().includes(low) || m.attendees.toLowerCase().includes(low));
                }
                return [...result].sort((a, b) => new Date(b.date) - new Date(a.date));
            }, [meetings, activeTab, selectedAxisId, searchTerm]);

            const activeAxis = axes.find(a => a.id === selectedAxisId);
            const archiveGroups = useMemo(() => {
                const closed = axes.filter(a => a.isClosed);
                const groups = {};
                closed.forEach(axis => {
                    const year = new Date(axis.closedAt || new Date()).getFullYear();
                    const month = new Date(axis.closedAt || new Date()).toLocaleString('fr-FR', { month: 'long' });
                    if (!groups[year]) groups[year] = {};
                    if (!groups[year][month]) groups[year][month] = [];
                    groups[year][month].push(axis);
                });
                return groups;
            }, [axes]);

            if (loading) return <div className="h-screen flex items-center justify-center bg-white font-bold text-indigo-600 animate-pulse">Connexion au Cloud...</div>;

            return (
                <div className="h-screen w-full bg-slate-50 flex flex-col font-sans text-slate-900 overflow-hidden text-left">
                    {notification && (
                        <div className="fixed top-6 left-1/2 -translate-x-1/2 z-[300] animate-in slide-in-from-top duration-300">
                            <div className="bg-slate-900 text-white px-6 py-3 rounded-2xl shadow-2xl flex items-center gap-3 border border-white/10">
                                <Icon name="check-circle-2" className="text-green-400" />
                                <span className="text-sm font-bold">{notification}</span>
                            </div>
                        </div>
                    )}

                    <div className="flex flex-1 overflow-hidden">
                        {/* BARRE LATÉRALE */}
                        <aside className="w-72 bg-white border-r border-slate-200 p-6 flex flex-col h-full shrink-0 shadow-sm z-20">
                            <div className="flex flex-col gap-1 mb-8 px-2 text-left">
                                <div className="flex items-center gap-2 text-left">
                                    <div className="bg-indigo-600 p-1.5 rounded-lg text-white"><Icon name="clipboard-list" size={22} /></div>
                                    <h1 className="font-black text-xl tracking-tighter uppercase text-slate-800">CR Manager</h1>
                                </div>
                                <p className="text-[11px] italic text-slate-500 font-medium ml-9 leading-none">M. MIFDAL Lahcen</p>
                            </div>

                            <nav className="space-y-1 flex-1 overflow-y-auto pr-2 no-scrollbar">
                                <button onClick={() => { setActiveTab('dashboard'); setSelectedAxisId(null); }} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl transition-all ${activeTab === 'dashboard' ? 'bg-indigo-50 text-indigo-700 font-bold' : 'text-slate-600 hover:bg-slate-50'}`}><Icon name="layout" size={18} /> Journal Global</button>
                                <div className="pt-6 pb-2 px-3 text-[10px] font-bold text-slate-400 uppercase tracking-widest text-left">Axes Actifs</div>
                                {axes.filter(a => !a.isClosed).map(axis => (
                                    <button key={axis.id} onClick={() => { setSelectedAxisId(axis.id); setActiveTab('axis'); }} className={`w-full flex items-center justify-between gap-3 px-3 py-2 rounded-lg text-sm transition-all truncate ${selectedAxisId === axis.id && activeTab === 'axis' ? 'bg-indigo-50 text-indigo-700 font-semibold' : 'text-slate-600 hover:bg-slate-50'}`}><div className="flex items-center gap-2 truncate text-left"><div className="w-1.5 h-1.5 bg-green-500 rounded-full shrink-0" /><span className="truncate">{axis.title}</span></div><Icon name="chevron-right" size={14} /></button>
                                ))}
                                <div className="pt-4 mt-2 border-t border-slate-100 text-left">
                                    <button onClick={() => setArchiveExpanded(!archiveExpanded)} className="w-full flex items-center justify-between px-3 py-2 text-slate-500 hover:text-slate-800 transition-colors"><div className="flex items-center gap-2 text-sm font-semibold"><Icon name="archive" size={16} /> Archives</div>{archiveExpanded ? <Icon name="chevron-down" size={14} /> : <Icon name="chevron-right" size={14} />}</button>
                                    {archiveExpanded && (
                                        <div className="pl-4 mt-1 space-y-4">
                                            {Object.keys(archiveGroups).sort((a,b) => b-a).map(year => (
                                                <div key={year}><div className="text-[10px] font-bold text-slate-400 px-3 uppercase mb-1 flex items-center gap-2"><Icon name="clock" size={10} /> {year}</div>{Object.keys(archiveGroups[year]).map(month => (<div key={month}><div className="text-[10px] text-slate-500 px-3 mb-1 italic capitalize">{month}</div>{archiveGroups[year][month].map(axis => (<button key={axis.id} onClick={() => { setSelectedAxisId(axis.id); setActiveTab('axis'); }} className={`w-full text-left px-3 py-1.5 rounded-lg text-[13px] transition-all truncate ${selectedAxisId === axis.id ? 'bg-slate-100 text-slate-900 font-medium' : 'text-slate-500 hover:bg-slate-50'}`}><Icon name="lock" size={10} className="inline mr-1 opacity-50" /> {axis.title}</button>))}</div>))}</div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </nav>
                            <button onClick={() => setShowNewAxisModal(true)} className="w-full flex items-center gap-2 px-3 py-2.5 mt-4 text-xs text-indigo-600 font-bold border border-dashed border-indigo-200 rounded-xl hover:bg-indigo-50"><Icon name="plus" size={16} /> Créer un Axe</button>
                        </aside>

                        {/* ESPACE PRINCIPAL */}
                        <main className="flex-1 overflow-y-auto h-full p-8 bg-slate-50/50 no-scrollbar">
                            <div className="max-w-5xl mx-auto">
                                <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-6 mb-12">
                                    <div className="text-left"><div className="flex items-center gap-3"><h2 className="text-4xl font-black text-slate-900 tracking-tighter uppercase">{activeTab === 'dashboard' ? 'Journal Global' : activeAxis?.title}</h2>{activeTab === 'axis' && activeAxis?.isClosed && (<span className="flex items-center gap-1 bg-slate-200 text-slate-600 text-[10px] font-bold uppercase tracking-widest px-2.5 py-1 rounded-full"><Icon name="lock" size={10} /> Archivé</span>)}</div><p className="text-slate-500 text-sm mt-3 font-medium max-w-2xl leading-relaxed">{activeTab === 'dashboard' ? 'Historique complet des décisions sauvegardées.' : activeAxis?.description}</p></div>
                                    <div className="flex flex-wrap gap-3 w-full lg:w-auto">
                                        {activeTab === 'axis' && activeAxis && (
                                            <div className="flex gap-2">
                                                <button onClick={() => toggleAxisStatus(activeAxis.id, activeAxis.isClosed)} className={`flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl text-sm font-bold bg-white border border-slate-200 hover:text-indigo-600 transition-all`}>{activeAxis?.isClosed ? <><Icon name="unlock" size={18} /> Ré-ouvrir</> : <><Icon name="lock" size={18} /> Clôturer</>}</button>
                                                <button onClick={() => setDeleteConfirm({ show: true, id: activeAxis.id, type: 'axis' })} className="p-2.5 bg-white text-red-500 border border-red-100 rounded-xl hover:bg-red-50 shadow-sm transition-all"><Icon name="trash-2" size={20} /></button>
                                            </div>
                                        )}
                                        <div className="relative flex-1 md:w-64 min-w-[200px]"><div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"><Icon name="search" size={16} /></div><input type="text" placeholder="Chercher..." className="w-full pl-10 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm outline-none transition-all shadow-sm focus:ring-2 focus:ring-indigo-500/10" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)}/></div>
                                        <button onClick={() => openMeetingModal()} disabled={activeTab === 'axis' && activeAxis?.isClosed} className="flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2.5 rounded-xl text-sm font-black transition-all shadow-xl shadow-indigo-100 disabled:opacity-50"><Icon name="plus" size={20} /> Nouveau CR</button>
                                    </div>
                                </div>

                                <div className="space-y-12 pb-20">
                                    {filteredMeetings.length === 0 ? (<div className="text-center py-24 bg-white border border-dashed border-slate-200 rounded-[2.5rem] shadow-sm"><Icon name="file-text" size={48} className="mx-auto mb-4 text-slate-200" /><p className="text-slate-500 font-bold uppercase tracking-widest text-sm text-center">Aucune décision enregistrée</p></div>) : (
                                        filteredMeetings.map(m => {
                                            const axis = axes.find(a => a.id === m.axisId);
                                            return (
                                                <div key={m.id} className="bg-white border border-slate-200 rounded-[2.5rem] overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300">
                                                    <div className="border-b border-slate-100 bg-slate-50/50 px-10 py-8 flex flex-col sm:flex-row justify-between gap-6">
                                                        <div className="flex flex-col gap-3 text-left">
                                                            <div className="flex items-center gap-3 flex-wrap">
                                                                <div className="flex items-center gap-2 font-bold text-slate-800 bg-white px-3.5 py-1.5 rounded-xl border border-slate-200 shadow-sm text-sm"><Icon name="calendar" size={16} className="text-indigo-600" />{new Date(m.date).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' })}</div>
                                                                <span className="flex items-center gap-1.5 bg-green-50 text-green-700 text-[10px] font-black uppercase tracking-widest px-3 py-1 rounded-lg border border-green-100 shadow-sm"><Icon name="check-circle-2" size={12} /> Sauvegardé Cloud</span>
                                                                {activeTab === 'dashboard' && (<span className="text-[10px] text-indigo-600 font-black tracking-tight uppercase px-3 py-1 bg-indigo-50 border border-indigo-100 rounded-lg">Axe : {axis?.title}</span>)}
                                                            </div>
                                                            <div className="flex items-start gap-2.5 mt-1 text-left"><Icon name="users" size={16} className="text-slate-400 shrink-0 mt-0.5" /><div className="flex flex-col gap-1 text-left">{renderAttendeeBadges(m.attendees)}</div></div>
                                                        </div>
                                                        <div className="flex items-center gap-2.5 self-start sm:self-center"><button onClick={() => openMeetingModal(m)} className="p-3 bg-white text-slate-400 hover:text-indigo-600 border border-slate-100 rounded-2xl shadow-sm transition-all"><Icon name="edit-3" size={20} /></button><button onClick={() => setDeleteConfirm({ show: true, id: m.id, type: 'meeting' })} className="p-3 bg-white text-slate-300 hover:text-red-500 border border-slate-100 rounded-2xl shadow-sm transition-all"><Icon name="trash-2" size={20} /></button></div>
                                                    </div>
                                                    <div className="p-10 grid grid-cols-1 lg:grid-cols-5 gap-12 text-left">
                                                        <div className="lg:col-span-3 text-left"><h4 className="text-[11px] font-black text-slate-400 uppercase tracking-[0.3em] mb-8 flex items-center gap-3 text-left"><div className="w-2 h-2 bg-indigo-500 rounded-full" /> Synthèse & Décisions</h4><div className="text-slate-700 leading-relaxed text-[17px] font-medium">{formatContent(m.discussed)}</div></div>
                                                        <div className="lg:col-span-2 bg-indigo-50/30 p-8 rounded-[2rem] border border-indigo-100/50 shadow-inner text-left"><h4 className="text-[11px] font-black text-indigo-700 uppercase tracking-[0.3em] mb-8 flex items-center gap-3 text-left"><Icon name="arrow-right" size={20} className="text-indigo-500" /> Suivi</h4><div className="text-slate-800 leading-relaxed text-[16px] italic">{formatContent(m.nextSteps || "N/A")}</div></div>
                                                    </div>
                                                </div>
                                            );
                                        })
                                    )}
                                </div>
                            </div>
                        </main>
                    </div>

                    {/* MODALES */}
                    {showMeetingModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md flex items-center justify-center p-4 z-[200] overflow-y-auto">
                            <div className="bg-white rounded-[3rem] w-full max-w-4xl p-12 shadow-2xl my-8 animate-in zoom-in duration-300 text-left">
                                <div className="flex justify-between items-start mb-12 text-left"><div><h3 className="text-4xl font-black text-slate-900 tracking-tight leading-none">Rédaction du CR</h3><p className="text-slate-400 text-sm font-semibold mt-3 uppercase tracking-widest">Saisie sécurisée</p></div><button onClick={() => setShowMeetingModal(false)} className="p-3 bg-slate-100 text-slate-400 hover:text-slate-900 rounded-full transition-all"><Icon name="x" size={28} /></button></div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-10 mb-10 text-left">
                                    <div className="text-left"><label className="block text-xs font-black text-slate-400 uppercase mb-3 ml-1">Axe</label><select className="w-full px-6 py-4 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none font-bold text-slate-700 focus:border-indigo-500 transition-all" value={meetingForm.axisId} onChange={(e) => setMeetingForm({...meetingForm, axisId: e.target.value})} disabled={!!editingMeetingId}><option value="">Sélectionner...</option>{axes.map(a => <option key={a.id} value={a.id}>{a.title}</option>)}</select></div>
                                    <div className="text-left"><label className="block text-xs font-black text-slate-400 uppercase mb-3 ml-1">Date</label><input type="date" className="w-full px-6 py-4 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none font-bold focus:border-indigo-500 transition-all" value={meetingForm.date} onChange={(e) => setMeetingForm({...meetingForm, date: e.target.value})} /></div>
                                </div>
                                <div className="space-y-10 text-left">
                                    <div className="text-left"><label className="block text-xs font-black text-slate-400 uppercase mb-3 ml-1">Participants (séparés par ;)</label><input type="text" placeholder="Lahcen; Alice; Bob" className="w-full px-6 py-4 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none font-medium focus:border-indigo-500 transition-all" value={meetingForm.attendees} onChange={(e) => setMeetingForm({...meetingForm, attendees: e.target.value})} /></div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-10 text-left">
                                        <div className="text-left"><label className="block text-xs font-black text-slate-400 uppercase mb-3 ml-1 text-left">Points traités</label><textarea className="w-full px-8 py-6 bg-slate-50 border-2 border-slate-100 rounded-3xl h-64 font-mono text-sm leading-relaxed outline-none focus:border-indigo-500 transition-all" value={meetingForm.discussed} onChange={(e) => setMeetingForm({...meetingForm, discussed: e.target.value})}></textarea></div>
                                        <div className="text-left"><label className="block text-xs font-black text-slate-400 uppercase mb-3 ml-1 text-left">Suivi</label><textarea className="w-full px-8 py-6 bg-indigo-50 border-2 border-indigo-100 rounded-3xl h-64 font-mono text-sm italic outline-none focus:border-indigo-500 transition-all" value={meetingForm.nextSteps} onChange={(e) => setMeetingForm({...meetingForm, nextSteps: e.target.value})}></textarea></div>
                                    </div>
                                    <div className="flex gap-6 pt-8 border-t border-slate-100"><button onClick={() => setShowMeetingModal(false)} className="px-10 py-4 border-2 border-slate-200 rounded-[1.8rem] text-sm font-bold text-slate-500 hover:bg-slate-50 transition-colors uppercase tracking-widest text-left">Annuler</button><button onClick={saveMeeting} disabled={!meetingForm.axisId || !meetingForm.discussed} className="flex-1 px-10 py-4 bg-indigo-600 text-white rounded-[1.8rem] text-sm font-black shadow-xl hover:bg-indigo-700 transition-all disabled:opacity-50 uppercase tracking-[0.2em] text-center">Sauvegarder Cloud</button></div>
                                </div>
                            </div>
                        </div>
                    )}

                    {showNewAxisModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md flex items-center justify-center p-4 z-[200]">
                            <div className="bg-white rounded-[3rem] w-full max-w-md p-10 shadow-2xl border border-white/20 animate-in zoom-in duration-300 text-left">
                                <h3 className="text-3xl font-black mb-8 text-slate-900 tracking-tight uppercase text-left">Nouvel axe</h3>
                                <div className="space-y-6 text-left">
                                    <div className="text-left"><label className="block text-xs font-black text-slate-400 uppercase mb-2 ml-1">Nom</label><input type="text" placeholder="ex: Audit 2026" className="w-full px-6 py-4 bg-slate-50 border-2 border-slate-100 rounded-2xl font-bold outline-none focus:border-indigo-500 transition-all" value={newAxis.title} onChange={(e) => setNewAxis({...newAxis, title: e.target.value})} /></div>
                                    <div className="text-left"><label className="block text-xs font-black text-slate-400 uppercase mb-2 ml-1">Objectif</label><textarea placeholder="But..." className="w-full px-6 py-4 bg-slate-50 border-2 border-slate-100 rounded-2xl h-32 resize-none outline-none font-medium focus:border-indigo-500 transition-all" value={newAxis.description} onChange={(e) => setNewAxis({...newAxis, description: e.target.value})}></textarea></div>
                                    <div className="flex gap-4 pt-4"><button onClick={() => setShowNewAxisModal(false)} className="flex-1 px-6 py-4 border-2 border-slate-200 rounded-2xl text-sm font-bold text-slate-500 hover:bg-slate-50 transition-colors uppercase tracking-widest">Annuler</button><button onClick={addAxis} className="flex-1 px-6 py-4 bg-indigo-600 text-white rounded-2xl text-sm font-black shadow-xl hover:bg-indigo-700 transition-all uppercase tracking-widest">Créer</button></div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODALE DE CONFIRMATION DE SUPPRESSION */}
                    {deleteConfirm.show && (
                        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4 z-[500]">
                            <div className="bg-white rounded-[2rem] w-full max-w-sm p-8 shadow-2xl text-center animate-in zoom-in duration-200">
                                <div className="bg-red-50 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-6">
                                    <Icon name="trash-2" className="text-red-600" size={32} />
                                </div>
                                <h3 className="text-xl font-black text-slate-900 mb-2">Confirmer la suppression</h3>
                                <p className="text-slate-500 mb-8 leading-relaxed">
                                    Êtes-vous certain de vouloir supprimer cet élément ? Cette action est irréversible.
                                </p>
                                <div className="flex gap-3">
                                    <button 
                                        onClick={() => setDeleteConfirm({ show: false, id: null, type: null })}
                                        className="flex-1 px-4 py-3 bg-slate-100 text-slate-600 rounded-xl font-bold hover:bg-slate-200 transition-all"
                                    >
                                        Annuler
                                    </button>
                                    <button 
                                        onClick={executeDelete}
                                        className="flex-1 px-4 py-3 bg-red-600 text-white rounded-xl font-bold hover:bg-red-700 shadow-lg shadow-red-200 transition-all"
                                    >
                                        Supprimer
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
